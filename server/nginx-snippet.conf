# mc.aikex.ink - 像素方块世界 (static + ws + room list)
server {
    include /www/server/nginx/conf/aike-global-security.conf;
    listen 80;
    server_name mc.aikex.ink;
    location ^~ /.well-known/acme-challenge/ {
        root /www/wwwroot/mc.aikex.ink;
        default_type "text/plain";
        try_files $uri =404;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}
server {
    include /www/server/nginx/conf/aike-global-security.conf;
    listen 443 ssl;
    http2 on;
    server_name mc.aikex.ink;
    ssl_certificate /www/server/panel/vhost/cert/mc.aikex.ink/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/mc.aikex.ink/privkey.pem;
    index index.html;
    root /www/wwwroot/mc.aikex.ink;

    location /ws {
        proxy_pass http://127.0.0.1:3040;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3040/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        add_header Cache-Control "no-store";
    }

    location /js/ {
        expires -1;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location ~* \.(css|png|jpg|svg|woff2)$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
    access_log /www/wwwlogs/mc.aikex.ink.log;
    error_log /www/wwwlogs/mc.aikex.ink.error.log;
}
